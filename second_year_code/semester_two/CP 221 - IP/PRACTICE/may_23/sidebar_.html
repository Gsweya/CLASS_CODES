<!DOCTYPE html>
<html>
    <head>
        <style>
            .header {
                background-color: lightblue;
                border: 2px solid black;
                padding: 20px;
                text-align: center;
            }

            .column {               
                width: 45%;
                padding: 20px;
                border: 2px solid black;
                margin-top: 20px;
            }

            .left {
                float: left;
                background-color: lightgreen;

            }

            .right {
                float: right;
                background-color: lightgray;
            }
            
        </style>
    </head>

    <body>

        <div class="header">
            Header Section
        </div>

        <div class="column left">
            Left Column
        </div>

        <div class="column right">
            Right Column
        </div>
    </body>
</html>
