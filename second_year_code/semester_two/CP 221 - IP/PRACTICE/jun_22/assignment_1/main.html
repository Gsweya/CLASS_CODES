<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../import.js"></script>
    <title>Student Profile</title>

</head>
<body>

    <h1> -- Student Profile -- </h1>
    <h2>List of 6 subjects</h2>

   
        
    <ul id="sub-list">
        <li id="_1" class="odd">Computer Science</li>
        <li id="_2" class="even">Biology</li>
        <li id="_3" class="odd">Agriculture</li>
        <li id="_4" class="even">Lifestyle</li>                                                                                           
        <li id="_5" class="odd">Pyhsics</li>
        <li id="_6" class="even">Chemistry</li>
    </ul>


    <button id="highlight-odd">
        Highlight Odd
    </button>
    <button id="highlight-even">
        Highlight even
    </button>

    <button id="show-first">
        Show first 3
    </button>

    <button id="hide-last">
        Hide last subject
    </button>

    <button id="clone">Clone</button>

    <script>

        $(document).ready(function(){

            let _even_no = $(".even");
            let _odd_no = $(".odd");

            let btn_even = $("#highlight-even");
            let btn_odd = $("#highlight-odd");

            let last_three = $("#sub-list li:gt(2)");
            let btn_last_4 = $("#show-first");

            let clone_btn = $("#clone");

            clone_btn.on("click", function(){
                let first_subject = $("#_1").text();

                $(`<li>${first_subject}</li>`).appendTo("#sub-list");

                
                
            });


            let btn_last_item = $("#hide-last");
            let last_item = $("#_6");
            btn_last_item.on("click", () => {
                last_item.remove();
            });

            btn_last_4.on("click", () => {
                last_three.remove();
            });
            
            btn_even.on("click", () => {
                _even_no.css("color", "blue");
            });

            btn_odd.on("click", () => {
                _odd_no.css("color", "red");
            });




        });
      


    </script>
    
    
</body>
</html>
