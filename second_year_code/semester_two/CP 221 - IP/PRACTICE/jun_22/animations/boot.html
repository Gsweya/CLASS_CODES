<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 4 Slideshow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
    <style>
        /* Custom styles to make slides visible and add a gentle hover effect */
        .carousel-item {
            height: 300px;
            background-color: #343a40; /* Dark gray background */
            color: white;
            font-size: 2rem;
        }

        /* Simple CSS Hover Effect: Zoom into the slideshow container slightly on hover */
        .carousel {
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .carousel:hover {
            transform: scale(1.01);
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Automated Slideshow (5s Interval)</h2>

    <div id="myCarousel" class="carousel slide rounded overflow-hidden" data-ride="carousel" data-interval="5000">
        
        <div class="carousel-inner">
            <div class="carousel-item active">
                <div class="d-flex h-100 align-items-center justify-content-center">
                    <div>🍏 Slide 1: Apples</div>
                </div>
            </div>
            <div class="carousel-item">
                <div class="d-flex h-100 align-items-center justify-content-center">
                    <div>🍌 Slide 2: Bananas</div>
                </div>
            </div>
            <div class="carousel-item">
                <div class="d-flex h-100 align-items-center justify-content-center">
                    <div>🍉 Slide 3: Melons</div>
                </div>
            </div>
        </div>

        <a class="carousel-control-prev" href="#myCarousel" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#myCarousel" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
        </a>
    </div>

    <div class="text-center mt-3">
        <button id="btn-pause" class="btn btn-warning mx-1">Pause Timer</button>
        <button id="btn-play" class="btn btn-success mx-1">Play Timer</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

<script>
    $(document).ready(function(){
        // Pause Button Click Functionality
        $("#btn-pause").on("click", function(){
            $("#myCarousel").carousel("pause");
        });

        // Play Button Click Functionality
        $("#btn-play").on("click", function(){
            $("#myCarousel").carousel("cycle");
        });
    });
</script>

</body>
</html>
