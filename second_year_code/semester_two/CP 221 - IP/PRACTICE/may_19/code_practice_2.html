<DOCTYPE html>
<html>

    <head>
        <meta name="veiwport" content="width=device-width, initial-scale=1.0">
        <title>User Registration Form</title>

        <style>
            * {
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif;
            }

            body {
                background: grey;
                padding: 30px;
            }

            .container {
                max-width: 900px;
                margin: auto;
                background: white;
                padding: 25px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0,0,0,0.2);
            }

            h1 {
                text-align: center;
                color: darkblue;
            }

            fieldset {
                margin-bottom: 20px;
                border: 2px solid #ccc;
                padding: 20px;
                border-radius: 10px;
            }

            legend {
                font-weight: bold;
                color: darkred;

            }

            input,
            select,
            textarea {
                width: 100%;
                padding: 10px;
                margin-top: 5px;
                border-radius: 5px;
                border: 1px solid #999;
            }

            input:focus,
            textarea:focus,
            select:focus {
                border-color: blue;
                outline: none;
            }

            .inline {
                width: auto;
                display: inline;
            }

            .buttons {
                text-align: center;
            
            }


            button {
                padding: 12px 20px;
                border: none;
                margin: 10px;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
            }

            .submit-btn {
                background: green;
                color: white;
            }

            .reset-btn {
                background: crimson;
                color: white;
            }

            .error {
                color: red;
                font-size: 14px;
            }

            .preview {
                background: #eff;
                padding: 15px;
                margin-top: 20px;
                border-radius: 10px;
            }


        </style>
    </head>

    <style></style>

    <body>

        <div class="container">
        <h1>User Registration Form</h1>

        <form id="registrationForm">
            <legend>Personal Information</legend>

            <fieldset>
                <label for="fullname">Full Name</label>
                
                <input 
                    type="text"
                    id="name"
                    placeholder="Enter full name"
                    required
                    minlength="3"
                    maxlength="50"
                    autocomplete="name"                    
                >

                <label for="email">Email</label>
                
                <input 
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
                    autocomplete="email"
                >

                <label for="phone">Phone Number</label>

                <input 
                    type="tel"
                    id="phone"
                    placeholder="+255.."
                    pattern="[0-9+ ]{10,15}"
                    required                
                >
                

                <label for="age">Age</label>

                <input  
                    type="number"
                    id="age"
                    name="age"
                    min="18"
                    max="100"
                    required
                >

                <label for="birthdate">Birth Date</label>

                <input  
                    type="date"
                    id="birthdate"
                    name="birthdate"
                    required
                >
                </fieldset>

                <!-- GENDER -->

                <fieldset>
                    <legend>Gender</legend>

                    <input 
                        type="radio"
                        id="male"
                        name="gender"
                        value="Male"
                        class="inline"
                        required
                    >

                    <label for="male" class="inline">Male</label>

                    <input 
                        type="radio"
                        id="female"
                        name="gender"
                        value="Female"
                        class="inline"
                    >
                    <label for="female" class="inline">Female</label>
                </fieldset>

                <!-- HOBBIES -->

                <fieldset>
                    <legend>Hobbies</legend>

                    <input 
                        type="checkbox"
                        id="music"
                        name="hobby"
                        value="Music"
                        class="inline"
                    >

                    <label for="music" class="inline">Music</label>

                    <input 
                        type="checkbox"
                        id="sports"
                        name="hobby"
                        value="Sports"
                        class="inline"
                    >

                    <label for="sports" class="inline">Sports</label>

                    <input
                        type="checkbox"
                        id="coding"
                        name="hobby"
                        value="Coding"
                        class="inline"
                    >

                    <label for="coding" class="inline">Coding</label>
                </fieldset>

                <!-- COUNTRY -->
                <fieldset>
                    <legend>Location</legend>

                    <label for="country">Country</label>

                    <select id="country" name="Country" required>
                        <option value="">-- Select Country --</option>

                        <option value="Tanzania">Tanzania</option>
                        <option value="Kenya">Kenya</option>
                        <option value="Uganda">Uganda</option>
                    </select>

                    <label for="city">City</label>

                    <input 
                        list="cities"
                        id="city"
                        name="city"
                        placeholder="Choose your type or city"
                    >

                    <datalist id="cities">
                        <option value="Dar es Salaam"></option>
                        <option value="Arusha"></option>
                        <option value="Mwanza"></option>
                        <option value="Dodoma"></option>
                    </datalist>
                </fieldset>

                <fieldset>
                    <legend>Upload</legend>

                    <label for="profile">Profile Picture</label>

                    <input 
                        type="file"
                        id="profile"
                        name="profile"
                        accept="image/*"
                    >
                </fieldset>

                <!-- RANGE -->

                <fieldset>
                    <legend> Experience Level</legend>

                    <label for="experience">
                        Experience (0 - 10)
                    </label>

                    <input 
                        type="range"
                        id="experience"
                        min="0"
                        max="10"
                        value="5"
                        oninput="output.value = experience.value"
                    >

                    <output id="output">5</output>
                </fieldset>

                <!-- MESSAGE -->

                <fieldset>
                    <legend>Additional Information</legend>

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        cols="40"
                        placeholder="Write something..."
                    ></textarea>
                </fieldset>

                <!-- TERMS -->

                <fieldset>
                    <legend>Agreement</legend>

                    <input 
                        type="checkbox"
                        id="terms"
                        required
                        class="inline"
                    >

                    <label for="terms" class="inline">
                        I accept the terms and conditions 
                    </label>
                </fieldset>


                <!-- BUTTONS -->

                <div class="buttons">
                    <button 
                        type="submit"
                        class="submit-btn"
                    >
                        Register 
                </button>

                <button
                    type="reset"
                    class="reset-btn"
                >
                    Reset
                </button>
                </div>

                <p class="error" id="errorMessage"></p>
        </form>

        <!-- PREVIEW -->

        <div class="preview">
            <h2>Live Preview</h2>

            <p id="previewText">
                User details will appear here... 
            </p>
        </div>
        </div>

        <script>

            const form = document.getElementById("registrationForm");

            const preview = document.getElementByID("previewText");

            const errorMessage = document.getElementById("errorMessage");

            // LIVE PREVIEW 

            form.addEventListener("input", function() {
                const fullname = document.getElementById("fullname").value;

                const email = document.getElementById("email").value;

                const country = document.getElementById("country").value;


                preview.innerHTML = `
                <strong>Name:</strong> ${fullname}<br>
                <strong>Email:</strong> ${email}<br>
                <strong>Country:</strong> ${country}
            `;
            });

            // FORM VALIDATION 

            form.addEventListener("submit", function(event){
                errorMessage.textContent = "";

                const password = document.getElementById("password").value;

                if (password.length < 8 ) {
                    event.preventDefault();

                    errorMessage.textContent = 
                        "Password must be at least 8 characters.";
                } else {
                    alert("Form submitted succesfully!");
                }


            });
        </script>

    </body>



</html>
