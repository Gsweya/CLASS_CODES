<!DOCTYPE html>
<html>
    <head>
        <title>Tab Title</title>
        
        <style>

            table, th, td {
            border: 1px solid black;
            border-collapse: collapse;

        }
        </style>
    </head>

    <body>

        <table>
            <tr>
                <th>Month</th>
                <th>Savings</th>
            </tr>

            <tr>
                <td>January</td>
                <td>$100</td>
            </tr>

            <tr>
                <td>February</td>
                <td>$800</td>
            </tr>
        </table>

        <a href="#bottom-page">Bottom of Page</a>
        
    
        <section id="bottom-page">
            <p>This page just contains, random info</p>
        </section>
    </body>
</html>
