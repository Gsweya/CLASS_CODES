<!DOCTYPE html>
<html>
<head>
    <title>SGR Ticket Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }
        .card {
            border: 1px solid #ccc;
            padding: 20px;
            width: 300px;
            border-radius: 8px;
        }
        .classes {
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>SGR Ticket Booking</h2>

        <select id="from">
            <option>Dar es Salaam</option>
            <option>Dodoma</option>
        </select>

        <select id="to">
            <option>Morogoro</option>
            <option>Mwanza</option>
        </select>

        <div class="classes">
            <label>
                <input type="radio" name="class" value="economy" checked>
                Economy
            </label>
            <label>
                <input type="radio" name="class" value="business">
                Business
            </label>
            <label>
                <input type="radio" name="class" value="royal">
                Royal
            </label>         
        </div>
        
        <h3>Ticket Price: <span id="price">31,000</span> TZS</h3>

        <button id="minus">-</button>
        <span id="count">1</span>
        <button id="plus">+</button>

        <h3>Total: <span id="total">31,000</span> TZS</h3>

        <button>Book Ticket</button>     
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        const prices = {
            economy: 31000,
            business: 45000,
            royal: 75000,
        };

        let count = 1;
        let price = 31000;

        function updateTotal() {
            // Update the quantity display text
            $('#count').text(count);
            // Update the single ticket price display
            $('#price').text(price.toLocaleString());
            // Update the total price display
            $('#total').text((count * price).toLocaleString());
        }

        // Handle class changes
        $('input[name="class"]').on('change', function() {
            price = prices[$(this).val()];
            updateTotal();
        });

        // Handle plus button
        $('#plus').click(function() {
            count++;
            updateTotal();
        });

        // Handle minus button
        $('#minus').click(function() {
            if (count > 1) {
                count--;
                updateTotal();
            }
        });
        
        // Initial run to ensure math aligns on startup
        updateTotal();
    </script>
</body>
</html>
