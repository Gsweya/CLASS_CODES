<!DOCTYPE html>
<html>
    <div class="card">

        <h2>
            SGR Ticket Booking
        </h2>

        <select id="from">
            <option>Dar es Salaam</option>
            <option>Dodoma</option>
        </select>

        <select id="to">
            <option>Morogoro</option>
            <option>Mwanza</option>
        </select>

        <div class="classes">
            <label>
                <input
                type="radio"
                name="class"
                value="economy"
                checked
                >
                Economy
            </label>

            <label>
                <input
                type="radio"
                name="class"
                value="business"
                >
                Business
            </label>

            <label>
                <input
                type="radio"
                name="class"
                value="royal"
                >
                Royal
            </label>         
        </div>
        

        <h3>
            Price:
            <span id="price">
                31,0000
            </span>
            TZS
        </h3>

        <button id="minus">
            -
        </button>

        <span id="count">
            1
        </span>

        <button id="plus">
            +
        </button>
                <button>
                Book Ticket
            </button>     
        </div>

        <body>
            <script>
                const prices = {
                    economy: 31000,
                    business: 45000,
                    royal: 75000,
                };

                const radios = document.querySelectorAll(
                    'input[name="class"]'
                );

                radios.forEach(
                    radio=> {
                        radio.addEventListener(
                            "change",
                            function(){
                                const selected = 
                                this.value;

                                document.getElementById("price").innerText = prices[selected].toLocaleString();
                            }
                        );
                    }
                );
            </script>
        </body>
</html>
