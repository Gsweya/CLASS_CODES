<!DOCTYPE html>
<html>

<head>
    <title>Booking & Library System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
        }

        /* Navigation */
        nav {
            background: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        nav a:hover {
            color: yellow;
        }

        /* Cards */
        .card1 {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease, opacity 0.5s ease;
        }

        /* Hover effect */
        .card1:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 20px gray;
            background: lightblue;
        }

        /* Table hover */
        tr:hover {
            background: #ddd;
        }

        /* Slideshow */
        #slider {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Fade animation fixed with backwards fill to prevent flashing */
        .fadein {
            animation: fadein 2s forwards;
        }

        @keyframes fadein {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Slide from left */
        .slideleft {
            animation: slideleft 1s forwards;
        }

        @keyframes slideleft {
            from {
                transform: translateX(-200px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media(max-width:768px) {
            #slider {
                height: 180px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="#booking">Booking</a>
        <a href="#library">Library</a>
        <a href="#gallery">Gallery</a>
    </nav>

    <div class="container">

        <div id="booking" class="card1 slideleft">
            <h2>Booking System</h2>
            <form>
                <label>Name</label>
                <input type="text" id="name" class="form-control">
                <br>
                <label>Seat Class</label>
                <select id="seat" class="form-control">
                    <option>Economy</option>
                    <option>Business</option>
                    <option>Royal</option>
                </select>
                <br>
                <button type="button" class="btn btn-primary" onclick="book()">Book</button>
            </form>
            <h4 id="result"></h4>
        </div>

        <div id="library" class="card1 fadein">
            <h2>Library System</h2>
            <h4>Available Books</h4>
            <ul id="books">
                <li>Database Systems</li>
                <li>Java Programming</li>
                <li>Networking Basics</li>
            </ul>
            <input type="text" id="newBook" class="form-control" placeholder="Enter book name">
            <br>
            <button class="btn btn-success" onclick="addBook()">Add Book</button>
            <br><br>

            <h4>Students & Borrowed Books</h4>
            <table class="table table-bordered">
                <tr>
                    <th>Student</th>
                    <th>Book</th>
                </tr>
                <tr>
                    <td>John</td>
                    <td>Database Systems</td>
                </tr>
                <tr>
                    <td>Mary</td>
                    <td>Networking Basics</td>
                </tr>
                <tr>
                    <td>Ali</td>
                    <td>Java Programming</td>
                </tr>
            </table>
        </div>

        <div id="gallery" class="card1">
            <h2>Image Gallery</h2>
            <img id="slider" src="https://picsum.photos/id/10/800/300">
            <br><br>
            <button class="btn btn-dark" onclick="addImage()">Add New Photo</button>
        </div>

    </div>

    <script>
        /* BOOKING */
        function book() {
            var name = document.getElementById("name").value;
            var seat = document.getElementById("seat").value;
            document.getElementById("result").innerHTML = "Booking Successful<br>" + "Name : " + name + "<br>Class : " + seat;
        }

        /* ADD BOOK */
        function addBook() {
            var book = document.getElementById("newBook").value;
            if(book.trim() !== "") {
                var li = document.createElement("li");
                li.innerHTML = book;
                document.getElementById("books").appendChild(li);
                document.getElementById("newBook").value = "";
            }
        }

        /* IMAGE SLIDESHOW */
        var images = [
            "https://picsum.photos/id/10/800/300",
            "https://picsum.photos/id/20/800/300",
            "https://picsum.photos/id/30/800/300"
        ];
        var i = 0;

        setInterval(function() {
            i++;
            if (i >= images.length) {
                i = 0;
            }
            // Smoothly fade out old image, swap source, and fade back in
            $("#slider").fadeOut(400, function() {
                $(this).attr("src", images[i]).fadeIn(400);
            });
        }, 5000);

        function addImage() {
            var random = Math.floor(Math.random() * 100);
            images.push("https://picsum.photos/id/" + random + "/800/300");
            alert("New photo added");
        }
    </script>

    <script>
        /* JQuery Effects Fixes */

        // Instead of breaking the layout by hiding the whole card container on hover, 
        // we can cleanly lower the opacity of the internal image slider when hovered.
        $("#gallery").hover(
            function() {
                $(this).find("#slider").stop().fadeTo(300, 0.7);
            },
            function() {
                $(this).find("#slider").stop().fadeTo(300, 1.0);
            }
        );

        // Fixed the library bouncing issue by separating handling for mouse enter and leave 
        // or using clear CSS transitions. Here we smoothly dim the background on library hover.
        $("#library").hover(
            function() {
                $(this).css("background-color", "lightyellow");
            },
            function() {
                $(this).css("background-color", "white");
            }
        );
    </script>
</body>

</html>
