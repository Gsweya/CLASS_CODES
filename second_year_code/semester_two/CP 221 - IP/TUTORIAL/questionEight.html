<!DOCTYPE html>
<html>
    <head>

        <title>Question 7 - Greeting Page</title>

        <script>

        let choice = prompt("Pick a number from 1 to 7");
        let message;

        switch (choice) {

          case "1":
            message = "It's the Start of the Week!";
            break;

          case "2":
            message = "It's Tudesday!";
            break;

          case "3":
            message = "It's Wednesday!";
            break;

          case "4":
            message = "It's Throwback Thursday!";
            break;

          case "5":
            message = "It's Fun Day, Friday!";
            break;

          case "6":
            message = "It's in Weekend!";
            break;
          case "7":
            message = "It's Sun Weekend!";
            break;
        }

        document.write("<h2>" + "Message:" + "</h2><br>");
        document.write("Hello !," + message);
        </script>

    </head>

    <body>

    </body>


</html>
