<!doctype html>
<html>
    <head>
        <script>
            function validateForm() {
                let fullName = prompt("Enter Full Name: ");
                if (fullName === "") {
                    alert("Name required");
                    return;
                }


                let studentID = prompt("Enter Student ID: ");
                if (isNaN(studentID)) {
                    alert("Student ID must be numberic.");
                    return;
                }


                let age = prompt("Enter Age: ");
                if (isNaN(age) || age < 18 || age > 35) {
                    alert("Invalid Input");
                    return;
                }

                document.write(
                    "<h2>Welcome " + fullName +
                    " (ID: " + studentID + ")</h2"
                );
            }
        </script>
    </head>

    <body>
        <button onclick="validateForm()">Register</button>
    </body>
</html>
